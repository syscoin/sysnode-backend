name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production cutover when the next default-branch push lands.
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.repository == 'syscoin/sysnode-backend' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  test:
    name: Jest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    env:
      CI: 'true'
      # Keep tests hermetic: anything that auto-opts-in based on
      # NODE_ENV stays in test mode, not dev/prod.
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # `npm ci` is strict about package-lock.json; if the lock
        # drifts we want the CI to fail loudly rather than silently
        # resolve a new tree.
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand --ci --colors

      - name: Verify Sentry codec integration
        run: npm run test:sentry-codec

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

  lint-sql:
    name: Schema sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify migrations directory has a deterministic ordering
        # Guard against accidentally shipping two migrations with
        # colliding numeric prefixes — the runner sorts lexicographically
        # and duplicate prefixes would make apply order undefined.
        run: |
          set -euo pipefail
          cd db/migrations
          dup=$(ls | awk -F'_' '{print $1}' | sort | uniq -d || true)
          if [ -n "$dup" ]; then
            echo "Duplicate migration prefix(es): $dup"
            exit 1
          fi

  deploy:
    name: Deploy production
    needs: [test, audit, lint-sql]
    if: github.event_name == 'push' && github.repository == 'syscoin/sysnode-backend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Request exact-commit deployment
        run: node scripts/request-deploy.cjs backend
        env:
          SYSNODE_DEPLOY_HOST: ${{ secrets.SYSNODE_DEPLOY_HOST }}
          SYSNODE_DEPLOY_USER: ${{ vars.SYSNODE_DEPLOY_USER }}
          SYSNODE_DEPLOY_KEY: ${{ secrets.SYSNODE_DEPLOY_KEY }}
          SYSNODE_KNOWN_HOSTS: ${{ secrets.SYSNODE_KNOWN_HOSTS }}
